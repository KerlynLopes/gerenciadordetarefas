<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <img id="icone-cabecalho" src="/images/icone-cabecalho.png" alt="lista de tarefas">
        <div id="texto-cabecalho">
            <h1>Gerenciador de Tarefas</h1>
            <h2>Organize suas tarefas do dia &#10084;</h2>
        </div>
    </header>
    <nav id="menu">
        <button id="abrir-tarefa">NOVA TAREFA</button>
        <h3>Categorias</h3>

        <ul id="menu-categorias">
            <li><button data-categoria="todas">Todas as tarefas</button></li>
            <li><button data-categoria="estudos">📚 Estudos</button></li>
            <li><button data-categoria="trabalho">💼 Trabalho</button></li>
            <li><button data-categoria="pessoal">🏡 Pessoal</button></li>
            <li><button data-categoria="compras">🛍️ Compras</button></li>
            <li><button data-categoria="projetos">💻 Projetos</button></li>
            <li><button id="criar-categoria">＋ Criar categoria</button></li>
        </ul>
        <div id="menu-lixeira">
            <button id="abrir-lixeira">🗑️ Lixeira</button>
        </div>
    </nav>
    <div id="fundo-modal"></div>
    <div id="nova-tarefa">
        <button type="button" id="fechar-tarefa">✕ Fechar</button>
        <h2>Nova tarefa</h2>
        <label for="titulo">Título:</label>
        <input type="text" id="titulo">
        <label for="descricao">Descrição:</label>
        <textarea id="descricao"></textarea>
        <label for="categoria">Categoria:</label>
        <select id="categoria">
            <option value="estudos">Estudos</option>
            <option value="trabalho">Trabalho</option>
            <option value="pessoal">Pessoal</option>
            <option value="compras">Compras</option>
            <option value="projetos">Projetos</option>
        </select>
        <p>Prioridade:</p>
        <label>
            <input type="radio" name="prioridade" value="minima">
            Mínima
        </label>
        <label>
            <input type="radio" name="prioridade" value="media">
            Média
        </label>
        <label>
            <input type="radio" name="prioridade" value="maxima">
            Máxima
        </label>
        <label for="data-limite">Concluir até:</label>
        <input type="date" id="data-limite" name="data-limite">
        <button id="adicionar">Adicionar</button>
    </div>
    <main>
        <section id="tarefas-andamento">
            <h2>Em andamento</h2>
            <div id="lista-tarefas"></div>
        </section>
        <section id="tarefas-concluidas">
            <h2>Concluídas</h2>
            <div id="lista-concluidas"></div>
        </section>
        <section id="area-lixeira">
    <h2>🗑️ Lixeira</h2>
    <div id="lista-excluidas"></div>
</section>
    </main>
    <aside>onboarding dashboarding</aside>
    <footer>
        <p>Feito por Kerlyn Lopes</p>
    </footer>
</body>

</html>
